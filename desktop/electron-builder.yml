appId: com.gathin.tvhome.desktop
productName: TV ViBEHACK
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: ../launcher/app/build/outputs/apk/debug/app-debug.apk
    to: app-debug.apk
  - from: ../examples
    to: examples

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.utilities

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
